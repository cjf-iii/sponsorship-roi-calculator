name: macOS Metal verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # A custom `metal` label prevents fallback to a non-Metal runner.
    runs-on: [self-hosted, macOS, ARM64, metal]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple Silicon and Metal
        run: ./scripts/verify_macos_metal.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
