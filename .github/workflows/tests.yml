name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.0"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --python 3.12 --group dev --group notebook
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v
      - name: Execute reviewer notebook
        run: uv run --group notebook jupyter nbconvert --to notebook --execute notebooks/01_data_to_validation.ipynb --stdout > /dev/null
      - name: Rebuild and verify résumé evidence
        run: |
          uv run python data/generate_data.py
          uv run python model/train.py
          uv run python scripts/verify_artifacts.py
      - name: Smoke-test Streamlit
        run: >-
          uv run python -c 'from streamlit.testing.v1 import AppTest;
          app = AppTest.from_file("app.py", default_timeout=60).run();
          assert not app.exception, app.exception'
