[project]
name = "sponsorship-roi-calculator"
version = "1.0.0"
description = "Reproducible XGBoost sponsorship ROI models with SHAP explainability and a Streamlit interface."
readme = "README.md"
license = "MIT"
authors = [
    { name = "CJ Fleming" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "joblib>=1.3,<2",
    "matplotlib>=3.7,<4",
    "numpy>=1.24,<2.5",
    "pandas>=2,<4",
    "scikit-learn>=1.3,<2",
    "shap>=0.43,<1",
    "streamlit>=1.61.1,<2",
    "xgboost>=2,<4",
]

[dependency-groups]
dev = ["ruff>=0.16,<0.17"]
notebook = [
    "ipykernel>=7,<8",
    "jupyterlab>=4.5,<5",
    "nbconvert>=7.17,<8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
